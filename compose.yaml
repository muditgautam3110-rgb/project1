services:
  api:
    # TODO: Build the API image, publish the API port, configure DB URL,
    # and wait for the database health check.
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://employee_user:change_me@db:5432/employee_db
    depends_on:
      db:
        condition: service_healthy    

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - employee_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_user -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # TODO: Add a persistent volume and health check.

# TODO: Declare the named volume.
volumes:
  employee_db_data: 